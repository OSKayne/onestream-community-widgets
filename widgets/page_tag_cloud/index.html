<style>
  :host {
    display: block;
  }
  .otpc-wrap {
    font-family: var(--font-family-base, inherit);
    border: 1px solid var(--color-border-default, #E2E5EA);
    border-radius: var(--radius-md, 8px);
    padding: 16px;
    background: var(--color-surface-default, #FFFFFF);
    box-sizing: border-box;
  }
  .otpc-title {
    margin: 0 0 4px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-default, #1A1A2E);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .otpc-subtitle {
    margin: 0 0 12px 0;
    font-size: 11px;
    color: var(--color-text-subtle, #6B7280);
  }
  .otpc-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .otpc-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--color-surface-secondary, #F3F4F8);
    color: var(--color-action-primary-default, #5B4FE5);
    text-decoration: none;
    line-height: 1.2;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .otpc-tag:hover {
    background: var(--color-surface-tertiary, #E9E9F7);
    border-color: var(--color-action-primary-default, #5B4FE5);
  }
  .otpc-count {
    font-size: 0.8em;
    opacity: 0.65;
  }
  .otpc-size-1 { font-size: 12px; }
  .otpc-size-2 { font-size: 14px; }
  .otpc-size-3 { font-size: 16px; font-weight: 600; }
  .otpc-size-4 { font-size: 19px; font-weight: 700; }
  .otpc-empty {
    font-size: 13px;
    color: var(--color-text-subtle, #6B7280);
    font-style: italic;
  }
  .otpc-scanning {
    font-size: 11px;
    color: var(--color-text-subtle, #6B7280);
    margin-top: 8px;
    font-style: italic;
  }
</style>

<div class="otpc-wrap">
  <p class="otpc-title" id="otpc-title">Tags on this page</p>
  <p class="otpc-subtitle" id="otpc-subtitle" style="display:none"></p>
  <div class="otpc-cloud" id="otpc-cloud">
    <span class="otpc-empty">Loading tags&hellip;</span>
  </div>
  <p class="otpc-scanning" id="otpc-scanning" style="display:none"></p>
</div>

<script type="module">
  // Tags widget (v1.3)
  //
  // Primary mode - SPACE-WIDE via the Community Search API (preferred):
  // If the current page's URL identifies a category/space (this
  // platform's URLs end each category/space segment in "-<numeric id>",
  // e.g. /news-3), the widget calls the "Community Search API" Connector
  // with that categoryIds filter and aggregates the `tags` field already
  // present on every result. This covers every topic in the space, not
  // just what's currently loaded on screen, in one or two API calls -
  // no per-topic fetching needed. Requires the "insided-search-api"
  // Connector to be configured (see connectors_registry.json) and the
  // Search API to be enabled for this community by Gainsight.
  //
  // Fallback mode - THIS PAGE ONLY, via DOM reading/crawling:
  // If no category can be identified from the URL, or the Connector call
  // fails (not yet configured, access not granted, etc.), the widget
  // falls back to reading tags straight from the page's own markup, plus
  // following article links already on the page to pick up tags that
  // only render on those articles' own pages (feed/listing pages don't
  // show tags per card here). This mode is capped (maxItemsToScan) and
  // additive across re-scans - see mentionsBySource below.
  //
  // Tag links: this platform's tag search URL format is confirmed as
  // /search?tags[0]=<tag name> (bracket array syntax). Scraped tag links
  // already carry a real, working href and are used as-is; tags that
  // come from the API (no DOM element to read a href from) get a link
  // built in that same format.

  const TAG_LINK_SELECTOR = 'a[href*="search_type=tag"], a[href*="tags%5B0%5D"], a[href*="tags[0]"]';
  const CONTENT_LINK_RE = /-\d+\/?$/;
  const EXCLUDED_PATH_RE = /^\/(members|search|topic|activity|login|ssoproxy|site|p|groups)(\/|$)/i;
  const NAV_EXCLUDE_SELECTOR = 'nav, header, [role="navigation"], [role="banner"], [role="menu"]';
  const CURRENT_PAGE_KEY = '::current-page::';
  const CONNECTOR_PERMALINK = 'insided-search-api';
  const SEARCH_API_PAGE_SIZE = 25; // Gainsight support: larger pages (up to 200 per spec) can 502 on big result sets
  const SEARCH_API_MAX_PAGES = 80; // safety cap: up to 2000 topics in a space, same ceiling as before at the smaller page size
  const BREADCRUMB_ITEM_SELECTOR = 'li.breadcrumb-item';
  const BREADCRUMB_SKIP_CLASSES = ['qa-breadcrumb-community', 'qa-breadcrumb-category']; // generic "Home" / "Community" root crumbs - not part of the space path

  function buildTagHref(label, categoryPath) {
    let href = '/search?' + encodeURIComponent('tags[0]') + '=' + encodeURIComponent(label);
    if (categoryPath) {
      href += '&category=' + encodeURIComponent(categoryPath);
    }
    return href;
  }

  function extractCategoryIdFromPath() {
    const firstSegment = window.location.pathname.split('/').filter(Boolean)[0] || '';
    const m = firstSegment.match(/-(\d+)$/);
    return m ? parseInt(m[1], 10) : null;
  }

  // Reads the page's own breadcrumb nav (e.g. Home > Community > Welcome >
  // News) and returns everything after the generic "Home"/"Community" root
  // crumbs, joined as "Welcome > News" - this matches the "category" query
  // parameter the community's own search page uses for a space filter, as
  // confirmed by clicking a tag with a space filter applied and inspecting
  // the resulting URL. DOM-based (not ID-based) since the category filter
  // is the space's display name path, not a numeric ID.
  function extractCategoryBreadcrumb() {
    const items = Array.from(document.querySelectorAll(BREADCRUMB_ITEM_SELECTOR));
    if (!items.length) return null;

    const parts = [];
    items.forEach((li) => {
      if (BREADCRUMB_SKIP_CLASSES.some((c) => li.classList.contains(c))) return;
      const clone = li.cloneNode(true);
      clone.querySelectorAll('i').forEach((icon) => icon.remove());
      const text = (clone.textContent || '').trim();
      if (text) parts.push(text);
    });

    return parts.length ? parts.join(' > ') : null;
  }

  export default async function init(sdk) {
    await sdk.whenReady();

    const titleEl = sdk.$('#otpc-title');
    const subtitleEl = sdk.$('#otpc-subtitle');
    const cloudEl = sdk.$('#otpc-cloud');
    const scanningEl = sdk.$('#otpc-scanning');

    let lastSignature = '';
    let debounceHandle = null;
    let crawlInFlight = false;
    let mode = null; // 'space' | 'page'
    let spaceFetchAttempted = false;
    let categoryPath = null; // human-readable space path for the "category" search filter, read from the breadcrumb

    // Persistent, additive state for fallback (page) mode: one entry per
    // source (current page, or a fetched article URL). Re-scans only
    // ever add new sources or refresh the current-page entry.
    const mentionsBySource = new Map();
    const triedUrls = new Set();

    function getConfig() {
      const props = sdk.getProps() || {};
      return {
        title: props.title || 'Tags on this page',
        maxTags: Number(props.maxTags) > 0 ? Number(props.maxTags) : 30,
        showCounts: props.showCounts !== false,
        maxItemsToScan: Number(props.maxItemsToScan) > 0 ? Number(props.maxItemsToScan) : 40
      };
    }

    function extractTagsFromDocument(doc) {
      const anchors = doc.querySelectorAll(TAG_LINK_SELECTOR);
      const out = [];
      anchors.forEach((a) => {
        const label = (a.textContent || '').trim();
        if (!label) return;
        out.push({ label, href: a.getAttribute('href') || '' });
      });
      return out;
    }

    // ---------- Space-wide mode (Community Search API via Connector) ----------

    async function fetchSearchPage(widgetServiceSdk, categoryId, page, pageSize) {
      return widgetServiceSdk.connectors.execute({
        permalink: CONNECTOR_PERMALINK,
        method: 'GET',
        queryParams: {
          q: '',
          categoryIds: [String(categoryId)],
          page: String(page),
          pageSize: String(pageSize)
        }
      });
    }

    async function fetchSpaceTags(categoryId) {
      const widgetServiceSdk = new window.WidgetServiceSDK();
      const mentions = [];

      for (let page = 1; page <= SEARCH_API_MAX_PAGES; page++) {
        let data;
        let pageSizeUsed = SEARCH_API_PAGE_SIZE;
        try {
          data = await fetchSearchPage(widgetServiceSdk, categoryId, page, pageSizeUsed);
        } catch (e) {
          // Large pages can 502 on big result sets (per Gainsight support) -
          // retry this one page at a much smaller size before giving up.
          console.warn('[Tags widget] Page ' + page + ' at pageSize ' + pageSizeUsed + ' failed, retrying smaller:', e && e.message);
          pageSizeUsed = 10;
          data = await fetchSearchPage(widgetServiceSdk, categoryId, page, pageSizeUsed);
        }

        const results = (data && data.community) || [];
        results.forEach((item) => {
          (item.tags || []).forEach((label) => {
            if (!label) return;
            mentions.push({ label, href: buildTagHref(label, categoryPath) });
          });
        });

        if (results.length < pageSizeUsed) break;
      }

      return mentions;
    }

    // ---------- Page mode (fallback: DOM read + same-origin crawl) ----------

    function collectContentLinks(limit) {
      const currentPath = window.location.pathname.replace(/\/$/, '');
      const anchors = Array.from(document.querySelectorAll('a[href]'));
      const seen = new Set();
      const links = [];

      for (const a of anchors) {
        if (links.length >= limit) break;
        if (a.closest(NAV_EXCLUDE_SELECTOR)) continue;
        const href = a.getAttribute('href');
        if (!href) continue;
        let url;
        try {
          url = new URL(href, window.location.origin);
        } catch (e) {
          continue;
        }
        if (url.origin !== window.location.origin) continue;
        const path = url.pathname.replace(/\/$/, '');
        if (!path || path === currentPath) continue;
        if (EXCLUDED_PATH_RE.test(path)) continue;
        if (!CONTENT_LINK_RE.test(path)) continue;
        const key = url.origin + path;
        if (seen.has(key)) continue;
        seen.add(key);
        links.push(key);
      }

      return links;
    }

    async function fetchTagsForUrl(url) {
      try {
        const res = await fetch(url, { credentials: 'include' });
        if (!res.ok) return [];
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return extractTagsFromDocument(doc);
      } catch (e) {
        return [];
      }
    }

    // ---------- Shared: aggregate + paint ----------

    function aggregate(allTagMentions) {
      const byLabel = new Map();
      allTagMentions.forEach(({ label, href }) => {
        const key = label.toLowerCase();
        const existing = byLabel.get(key);
        if (existing) {
          existing.count += 1;
        } else {
          byLabel.set(key, { label, href, count: 1 });
        }
      });
      return Array.from(byLabel.values()).sort((a, b) => b.count - a.count);
    }

    function paint(tagMentions) {
      const config = getConfig();
      if (titleEl) titleEl.textContent = config.title;
      if (subtitleEl) {
        if (mode === 'space') {
          subtitleEl.textContent = 'Across the whole space';
          subtitleEl.style.display = 'block';
        } else if (mode === 'page') {
          subtitleEl.textContent = 'From this page';
          subtitleEl.style.display = 'block';
        } else {
          subtitleEl.style.display = 'none';
        }
      }

      const tags = aggregate(tagMentions).slice(0, config.maxTags);
      const signature = mode + '|' + config.showCounts + '|' + JSON.stringify(tags.map((t) => [t.label, t.count]));
      if (signature === lastSignature) return;
      lastSignature = signature;

      if (!cloudEl) return;
      cloudEl.innerHTML = '';

      if (tags.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'otpc-empty';
        empty.textContent = 'No tags found yet.';
        cloudEl.appendChild(empty);
        return;
      }

      const maxCount = tags[0].count;
      tags.forEach((tag) => {
        const ratio = maxCount > 0 ? tag.count / maxCount : 0;
        const sizeTier = ratio > 0.75 ? 4 : ratio > 0.5 ? 3 : ratio > 0.25 ? 2 : 1;

        const link = document.createElement('a');
        link.className = 'otpc-tag otpc-size-' + sizeTier;
        link.href = tag.href || buildTagHref(tag.label, categoryPath);
        link.textContent = tag.label;

        if (config.showCounts) {
          const countEl = document.createElement('span');
          countEl.className = 'otpc-count';
          countEl.textContent = '(' + tag.count + ')';
          link.appendChild(countEl);
        }

        cloudEl.appendChild(link);
      });
    }

    function flattenPageMentions() {
      const all = [];
      mentionsBySource.forEach((arr) => { all.push(...arr); });
      return all;
    }

    // ---------- Page-mode render loop (fallback only) ----------

    async function renderPageMode() {
      mode = 'page';
      mentionsBySource.set(CURRENT_PAGE_KEY, extractTagsFromDocument(document));
      paint(flattenPageMentions());

      if (crawlInFlight) return;
      crawlInFlight = true;

      const config = getConfig();
      const budgetRemaining = Math.max(0, config.maxItemsToScan - triedUrls.size);
      const links = budgetRemaining > 0
        ? collectContentLinks(triedUrls.size + budgetRemaining).filter((u) => !triedUrls.has(u)).slice(0, budgetRemaining)
        : [];

      if (links.length > 0 && scanningEl) {
        scanningEl.style.display = 'block';
        scanningEl.textContent = 'Scanning ' + links.length + ' new linked item(s) for tags…';
      }

      const BATCH_SIZE = 6;
      for (let i = 0; i < links.length; i += BATCH_SIZE) {
        const batch = links.slice(i, i + BATCH_SIZE);
        batch.forEach((u) => triedUrls.add(u));
        const results = await Promise.all(batch.map(fetchTagsForUrl));
        batch.forEach((u, idx) => { mentionsBySource.set(u, results[idx]); });
        paint(flattenPageMentions());
      }

      if (scanningEl) scanningEl.style.display = 'none';
      crawlInFlight = false;
    }

    // ---------- Top-level render: try space mode once, else page mode ----------

    async function render() {
      const categoryId = extractCategoryIdFromPath();
      if (categoryPath === null) categoryPath = extractCategoryBreadcrumb();

      if (categoryId !== null && !spaceFetchAttempted) {
        spaceFetchAttempted = true;
        if (scanningEl) {
          scanningEl.style.display = 'block';
          scanningEl.textContent = 'Loading tags for this space…';
        }
        try {
          const spaceMentions = await fetchSpaceTags(categoryId);
          mode = 'space';
          if (scanningEl) scanningEl.style.display = 'none';
          paint(spaceMentions);
          return; // space mode succeeded - no need for page-mode crawling
        } catch (e) {
          console.warn('[Tags widget] Space-wide lookup failed, falling back to page mode:', e && e.message);
          if (scanningEl) scanningEl.style.display = 'none';
          // fall through to page mode below
        }
      }

      if (mode === 'space') {
        // Space mode already succeeded earlier - nothing more to do on
        // subsequent re-scans (the space's tag set doesn't change just
        // because the DOM mutated).
        return;
      }

      await renderPageMode();
    }

    function scheduleRender() {
      if (debounceHandle) clearTimeout(debounceHandle);
      debounceHandle = setTimeout(render, 400);
    }

    render();
    [500, 1500].forEach((ms) => setTimeout(scheduleRender, ms));

    // Re-scan (debounced) as the page changes underneath it. In space
    // mode this is a cheap no-op once loaded; in page mode it's how new
    // "show more" content gets picked up (additive, see mentionsBySource).
    const observer = new MutationObserver(scheduleRender);
    observer.observe(document.body, { childList: true, subtree: true });

    sdk.on('destroy', () => {
      observer.disconnect();
      if (debounceHandle) clearTimeout(debounceHandle);
    });

    sdk.on('propsChanged', () => {
      lastSignature = '';
      if (mode === 'space') {
        // nothing cached beyond what's already painted; re-run to apply
        // new title/maxTags/showCounts against the last known data isn't
        // stored separately, so just re-trigger a fresh fetch.
        spaceFetchAttempted = false;
        render();
      } else {
        paint(flattenPageMentions());
      }
    });
  }
</script>
